name: Publish Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: Docker target platforms
        required: true
        default: linux/amd64,linux/arm64
        type: string

env:
  IMAGE_NAME: chatgpt2api

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: app
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export production image
        if: inputs.platforms == 'linux/amd64'
        run: |
          image_ref="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          docker pull "$image_ref"
          docker save "$image_ref" | gzip > /tmp/chatgpt2api-image.tar.gz

      - name: Upload production image
        if: inputs.platforms == 'linux/amd64'
        uses: actions/upload-artifact@v4
        with:
          name: production-image-${{ github.sha }}
          path: /tmp/chatgpt2api-image.tar.gz
          compression-level: 0
          retention-days: 3
