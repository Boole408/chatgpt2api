services:
  app:
    build:
      context: .
      target: app
    image: ${CHATGPT2API_IMAGE:-chatgpt2api:local}
    container_name: chatgpt2api
    restart: unless-stopped
    ports:
      - "${CHATGPT2API_HOST_PORT:-3000}:80"
    volumes:
      - ${CHATGPT2API_DATA_DIR:-./data-go}:/app/data
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        bind:
          create_host_path: false
    environment:
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-}
      DATABASE_URL: ${CHATGPT2API_DATABASE_URL:-}
