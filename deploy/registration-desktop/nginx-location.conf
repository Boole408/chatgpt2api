# Include inside the HTTPS server block after configuring the password file.
location ^~ /registration-desktop/ {
    auth_basic "Registration Desktop";
    auth_basic_user_file /etc/nginx/.htpasswd-registration-desktop;
    proxy_pass http://127.0.0.1:16080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Authorization "";
    proxy_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    add_header Cache-Control "no-store" always;
}
